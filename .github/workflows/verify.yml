name: verify
on:
  push:
    branches:
      - "main"
  # 週 1 回は前回結果を使わず全件を検証する（ジャッジ側のテストデータ更新やツールの版の変化を拾う）。
  schedule:
    - cron: "23 19 * * 6"
  workflow_dispatch:
    inputs:
      ignore_prev_result:
        description: "前回結果を使わず全件を検証する"
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      split-size: ${{ steps.split.outputs.size }}
      split-indices: ${{ steps.split.outputs.indices }}
    steps:
      - uses: actions/checkout@v5

      # 前回結果があれば差分検証なので少ない分割、なければ全件検証なので多い分割にする。
      # 分割数は並列度だけを変え、検証対象は変えない（verify 側で前回結果を改めて取り出す）。
      - name: Look up previous result
        if: ${{ github.event_name != 'schedule' && !inputs.ignore_prev_result }}
        id: lookup-prev-result
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/merged-result.json
          key: verify-result-${{ hashFiles('config.toml', '.github/workflows/verify.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            verify-result-${{ hashFiles('config.toml', '.github/workflows/verify.yml') }}-
          lookup-only: true

      - name: Decide split size
        id: split
        shell: bash
        run: |
          if [ -n "$MATCHED_KEY" ]; then size=4; else size=20; fi
          indices=$(python3 -c 'import json, sys; print(json.dumps([f"{i:02d}" for i in range(int(sys.argv[1]))]))' "$size")
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "indices=$indices" >> "$GITHUB_OUTPUT"
          echo "split size: $size (previous result: ${MATCHED_KEY:-none})"
        env:
          MATCHED_KEY: ${{ steps.lookup-prev-result.outputs.cache-matched-key }}

      - name: Set up competitive-verifier
        uses: competitive-verifier/actions/setup@v2
        with:
          python-version: "3.11"
          cache-pip: true

      # Initialize your own environment for resolving.
      - name: oj-resolve
        uses: competitive-verifier/actions/oj-resolve@v2
        with:
          output-path: verify_files.json
          # Specify patterns
          # include: your-own-include/
          # exclude: your-own-exclude/
          # If you have config.toml
          # config: .verify-helper/config.toml
          config: config.toml

      - name: Upload verify_files.json
        uses: competitive-verifier/actions/upload-verify-artifact@v2
        with:
          file: verify_files.json

      - name: Check bundled
        id: test-bundled
        run: |
          echo "count=$(find .competitive-verifier/bundled/ -type f | wc -l)" >> $GITHUB_OUTPUT
      - name: Upload bundled
        uses: actions/upload-artifact@v7
        if: steps.test-bundled.outputs.count > 0
        with:
          name: Bundled-${{ runner.os }}
          path: .competitive-verifier/bundled
          retention-days: 1

  verify:
    runs-on: ubuntu-latest
    needs: [setup]
    env:
      SPLIT_SIZE: ${{ needs.setup.outputs.split-size }}
    strategy:
      matrix:
        index: ${{ fromJSON(needs.setup.outputs.split-indices) }}
    steps:
      - uses: actions/checkout@v5

      - name: Download verify_files.json
        uses: competitive-verifier/actions/download-verify-artifact@v2

      # 前回結果と中身のハッシュを比べ、テストファイルと依存先が変わったものだけを検証する。
      # キーに config.toml / このワークフローのハッシュを含め、これらを変えると全件を検証する。
      # キーは実行ごとに一意（run_id, run_attempt）で、restore-keys の前方一致で直近の結果を取り出す。
      - name: Restore previous result
        if: ${{ github.event_name != 'schedule' && !inputs.ignore_prev_result }}
        id: restore-prev-result
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/merged-result.json
          key: verify-result-${{ hashFiles('config.toml', '.github/workflows/verify.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            verify-result-${{ hashFiles('config.toml', '.github/workflows/verify.yml') }}-

      - name: Set up competitive-verifier
        uses: competitive-verifier/actions/setup@v2
        with:
          cache-pip: true

      - name: Set up PyPy
        uses: actions/setup-python@v6
        with:
          python-version: "pypy3.11"

      - name: Verify
        uses: competitive-verifier/actions/verify@v2
        with:
          destination: ${{runner.temp}}/result.json
          split-size: ${{ env.SPLIT_SIZE }}
          split-index: ${{ matrix.index }}
          timeout: 1800
          prev-result: ${{ steps.restore-prev-result.outputs.cache-matched-key && 'merged-result.json' || '' }}
          hash: true

      - name: Upload result artifact
        uses: actions/upload-artifact@v7
        with:
          name: Result-${{ runner.os }}-${{ matrix.index }}
          path: ${{runner.temp}}/result.json
          retention-days: 1

  docs-and-check:
    runs-on: ubuntu-latest
    needs: [verify]
    outputs:
      upload-pages: ${{steps.upload-pages.outcome == 'success'}}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2147483647
  
      - name: Download verify_files.json and all artifacts
        id: all-artifacts
        uses: competitive-verifier/actions/download-verify-artifact@v2
        with:
          download-all: true
          artifact-root: .artifacts/
  
      - name: Extract bundled
        shell: bash
        run: |
          rm -rf .competitive-verifier/bundled
          if test -d "$SRCDIR"; then
            mkdir -p .competitive-verifier/
            mv "$SRCDIR" .competitive-verifier/bundled
          else
            echo "$SRCDIR does not exist."
          fi
        env:
          SRCDIR: .artifacts/Bundled-${{ runner.os }}

      - name: Set up competitive-verifier
        uses: competitive-verifier/actions/setup@v2
        with:
          python-version: "3.11"
          cache-pip: true

      - name: Merge results
        uses: competitive-verifier/actions/merge-result@v2
        with:
          result-files: ${{ steps.all-artifacts.outputs.artifacts-root }}/Result-*/result.json
          output-path: ${{ github.workspace }}/merged-result.json

      - name: Docs
        uses: competitive-verifier/actions/docs@v2
        with:
          verify-result: ${{ github.workspace }}/merged-result.json
          destination: _jekyll
          write-summary: true

      # 失敗した検証も記録され、次回は変更がなくても再検証される。
      # キャッシュは同じキーで上書きできないので、同じ SHA の全件検証や再実行の結果も残るよう
      # キーを実行ごとに一意にする。
      - name: Save result
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/merged-result.json
          key: verify-result-${{ hashFiles('config.toml', '.github/workflows/verify.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Add quick references
        run: |
          python3 scripts/add_quick_reference.py

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: _jekyll
          destination: _site
      - name: Upload artifact
        id: upload-pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Check
        uses: competitive-verifier/actions/check@v2
        with:
          verify-result: ${{ github.workspace }}/merged-result.json
  deploy:
    if: (success() || failure()) && github.ref == 'refs/heads/main'
    needs: docs-and-check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
